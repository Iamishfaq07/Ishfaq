<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Ishfaq Ahmad Bhat</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f2efe8">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<script>(function(){var t="light";try{t=localStorage.getItem("theme")||"light";}catch(e){}document.documentElement.setAttribute("data-theme",t);document.documentElement.classList.add("js");})();</script>
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<main class="wrap" id="main" style="min-height:78vh;display:grid;align-content:center;gap:10px;padding-block:80px">
  <p class="label" style="margin:0"><span class="glitch" data-text="404">404</span> — not found</p>
  <h1 data-split>Nothing here.</h1>
  <p class="lede" style="margin:14px 0 30px">
    The page you asked for doesn't exist — or it moved and I forgot to leave a note.
    Press <span class="kbd">⌘K</span> to search.
  </p>
  <div class="cta-row" style="margin:0">
    <a class="btn btn-primary" data-magnet href="/">Back home</a>
    <a class="btn btn-ghost" data-magnet href="/blog.html">Read the writeups</a>
  </div>
</main>

<div id="palette" role="dialog" aria-modal="true" aria-label="Command palette" aria-hidden="true">
  <div class="pal-box">
    <div class="pal-top">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="palInput" type="text" placeholder="Jump to a section or a post…" autocomplete="off" spellcheck="false">
      <span class="kbd">esc</span>
    </div>
    <ul id="palList"></ul>
    <div class="pal-foot">
      <span><span class="kbd">↑</span> <span class="kbd">↓</span> navigate</span>
      <span><span class="kbd">↵</span> open</span>
    </div>
  </div>
</div>

<a class="hidden" hidden href="/" data-pal="Home" data-pal-kind="Open">Home</a>
<a class="hidden" hidden href="/blog.html" data-pal="All writing" data-pal-kind="Open">Writing</a>
<a class="hidden" hidden href="/resume.html" data-pal="Résumé" data-pal-kind="Open">Résumé</a>

<div id="toasts" aria-live="polite"></div>

<script src="/main.js"></script>
<script src="/anim.js"></script>
</body>
</html>
