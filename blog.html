<script>
(function () {
  var listEl = document.getElementById('posts');
  var filtersEl = document.getElementById('filters');
  var all = [];
  var active = 'All';

  function draw() {
    var shown = active === 'All' ? all : all.filter(function (p) { return p.tag === active; });
    listEl.innerHTML = shown.length
      ? shown.map(window.postCardHTML).join('')
      : '<p class="empty">Nothing filed under “' + window.esc(active) + '” yet.</p>';
    filtersEl.querySelectorAll('.chip').forEach(function (c) {
      c.setAttribute('aria-pressed', String(c.dataset.tag === active));
    });
  }

  fetch('/posts/index.json')
    .then(function (r) { return r.json(); })
    .then(function (posts) {
      all = posts.filter(function (p) { return !p.draft; })
                 .sort(function (a, b) { return b.date.localeCompare(a.date); });
      if (!all.length) { listEl.innerHTML = '<p class="empty">No posts yet — first one is on its way.</p>'; return; }

      var tags = ['All'].concat(all.map(function (p) { return p.tag; })
        .filter(function (t, i, a) { return t && a.indexOf(t) === i; }).sort());
      filtersEl.innerHTML = tags.map(function (t) {
        return '<button class="chip" data-tag="' + window.esc(t) + '" aria-pressed="false">' + window.esc(t) + '</button>';
      }).join('');
      filtersEl.addEventListener('click', function (e) {
        var chip = e.target.closest('.chip');
        if (!chip) return;
        active = chip.dataset.tag;
        draw();
      });
      draw();
    })
    .catch(function () {
      listEl.innerHTML = '<p class="empty">Posts couldn\'t be loaded right now.</p>';
    });
})();
</script>
